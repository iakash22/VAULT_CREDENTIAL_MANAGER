# Vault — Docker Compose
#
# Local database only (default):
#   docker compose up -d postgres
#
# Full local stack with self-signed HTTPS:
#   ./infra/scripts/generate-dev-certs.sh   # or generate-dev-certs.ps1 on Windows
#   docker compose --profile full up -d --build
#
# Production (Let's Encrypt + Nginx):
#   See docs/DEPLOYMENT.md and docker-compose.prod.yml

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-vault}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vault} -d ${POSTGRES_DB:-vault}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["full", "production"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD:-change-this-dev-password}@postgres:5432/${POSTGRES_DB:-vault}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    profiles: ["full", "production"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_IDLE_LOCK_MINUTES: ${VITE_IDLE_LOCK_MINUTES:-15}
        VITE_JWT_REFRESH_BEFORE_SEC: ${VITE_JWT_REFRESH_BEFORE_SEC:-120}
        VITE_CLIPBOARD_CLEAR_MS: ${VITE_CLIPBOARD_CLEAR_MS:-30000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"

  nginx:
    profiles: ["full", "production"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
